name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oculos
          POSTGRES_PASSWORD: oculos_dev
          POSTGRES_DB: oculos_meta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oculos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oculos:oculos_dev@localhost:5432/oculos_meta_test?schema=public
      DIRECT_URL: postgresql://oculos:oculos_dev@localhost:5432/oculos_meta_test?schema=public
      TEST_DATABASE_URL: postgresql://oculos:oculos_dev@localhost:5432/oculos_meta_test?schema=public
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-with-at-least-32-characters-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
